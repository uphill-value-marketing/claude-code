<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>upHill Showreel</title>
<style>
  @font-face { font-family: "PF"; src: url(assets/PlayfairDisplay-Bold.ttf); font-weight: 700; }
  @font-face { font-family: "PF"; src: url(assets/PlayfairDisplay-Medium.ttf); font-weight: 500; }
  @font-face { font-family: "PF"; src: url(assets/PlayfairDisplay-MediumItalic.ttf); font-weight: 500; font-style: italic; }
  @font-face { font-family: "IN"; src: url(assets/Inter_18pt-Regular.ttf); font-weight: 400; }
  @font-face { font-family: "IN"; src: url(assets/Inter_18pt-Medium.ttf); font-weight: 500; }
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ============================================================
   upHill Value Marketing – Motion Showreel (9:16, 30 fps)
   Deterministic: render(t) draws exactly the frame at time t.
   ============================================================ */
const W = 1080, H = 1920, FPS = 30, DUR = 29.5, VO = 0.6;
const C = {
  or: '#EF762E', orD: '#C05A15', orL: '#F59A5F', dark: '#1C1C1C', grey: '#4A4845',
  logo: '#717071', beige: '#E8E4DF', cream: '#F0EDE9', white: '#FFFFFF',
};
const cv = document.getElementById('c');
const out = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const ctx = buf.getContext('2d');
let DATA = null, LOGO = null;

/* ---------- math & easing ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: x => x,
  inC: x => x * x * x,
  outC: x => 1 - Math.pow(1 - x, 3),
  outQ: x => 1 - Math.pow(1 - x, 5),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutQ: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  elastic: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1,
  expo: x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x),
};
const ease = (t, a, b, fn = E.outC) => fn(prog(t, a, b));
// damped spring impulse: 0 before t0, rings and settles
const spring = (t, t0, freq = 3, damp = 5) => t < t0 ? 0 : Math.exp(-damp * (t - t0)) * Math.sin((t - t0) * freq * Math.PI * 2);
function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const V = s => s + VO; // voice time -> video time

/* ---------- drawing helpers ---------- */
function font(size, fam = 'PF', w = 700, it = false) { ctx.font = `${it ? 'italic ' : ''}${w} ${size}px ${fam}`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fillBg(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function withT(x, y, rot, sx, sy, fn) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(sx ?? 1, sy ?? sx ?? 1); fn(); ctx.restore(); }

// The logo's "uphill steps" bracket (orange L rotated), centred on 0,0
function bracket(size, thick, color) {
  ctx.fillStyle = color;
  ctx.fillRect(-size / 2, -size / 2, size, thick);
  ctx.fillRect(size / 2 - thick, -size / 2, thick, size);
}

// Kinetic headline: words = [{t, s, style}], each slides up out of a mask.
function kinetic(lines, cx, y0, t, opt = {}) {
  const lh = opt.lh || 1.12;
  lines.forEach((line, li) => {
    let total = 0; const ms = [];
    line.forEach(w => { font(w.size || opt.size, w.fam || 'PF', w.w || 700, w.it); const m = ctx.measureText(w.s).width; ms.push(m); total += m; });
    const sp = (opt.size || 100) * 0.26; total += sp * (line.length - 1);
    let x = cx - total / 2;
    const y = y0 + li * (opt.size || 100) * lh;
    line.forEach((w, wi) => {
      const size = w.size || opt.size;
      const p = ease(t, w.t, w.t + (opt.dur || .45), E.outQ);
      const pOut = opt.out ? ease(t, opt.out + wi * .03 + li * .05, opt.out + .35 + wi * .03 + li * .05, E.inC) : 0;
      if (p > 0 && pOut < 1) {
        ctx.save();
        ctx.beginPath(); ctx.rect(x - 40, y - size * 1.1, ms[wi] + 80, size * 1.45); ctx.clip();
        const dy = (1 - p) * size * 1.2 - pOut * size * 1.3;
        const pop = 1 + spring(t, w.t + .1, 2.2, 7) * 0.06;
        ctx.translate(x + ms[wi] / 2, y + dy);
        ctx.rotate((1 - p) * 0.12);
        ctx.scale(pop, pop);
        font(size, w.fam || 'PF', w.w || 700, w.it);
        ctx.fillStyle = w.c || opt.c; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillText(w.s, 0, 0);
        if (w.u) { // underline swipe
          const up = ease(t, w.t + .25, w.t + .7, E.outQ);
          ctx.fillStyle = C.or; ctx.fillRect(-ms[wi] / 2, size * .14, ms[wi] * up, size * .08);
        }
        ctx.restore();
      }
      x += ms[wi] + sp;
    });
  });
}
function label(s, x, y, size, c, align = 'center', w = 500, fam = 'IN', ls = 0) {
  font(size, fam, w); ctx.fillStyle = c; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (ls) ctx.letterSpacing = ls + 'px';
  ctx.fillText(s, x, y); ctx.letterSpacing = '0px';
}

/* ---------- background grain & vignette ---------- */
const grains = [];
for (let g = 0; g < 6; g++) {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960;
  const x = c.getContext('2d'); const id = x.createImageData(540, 960);
  for (let i = 0; i < id.data.length; i += 4) { const v = rand(i * 0.37 + g * 999.1) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
  x.putImageData(id, 0, 0); grains.push(c);
}

/* ============================================================
   CHARACTER: "Hilli" – a friendly mountain with an orange peak
   ============================================================ */
function mouthAt(t) {
  if (!DATA) return 0;
  const f = (t - VO) * FPS; const i = Math.floor(f);
  if (i < 0 || i >= DATA.env.length - 1) return 0;
  return lerp(DATA.env[i], DATA.env[i + 1], f - i);
}
function blinkAt(t) {
  const blinks = [1.9, 5.4, 9.6, 13.3, 16.9, 20.4, 24.2, 27.8];
  for (const b of blinks) { const d = Math.abs(t - b); if (d < .09) return 1 - d / .09; }
  return 0;
}
// mood: {brow, smile, eye, lookX, lookY}, arms: {l, r} angle in rad (0 = down), wave
function hilli(x, y, s, t, st) {
  const m = mouthAt(t);
  const bob = Math.sin(t * Math.PI * 2 * (120 / 60) / 2) * 6 + m * 6; // bob to 120bpm half-time
  const squash = 1 + Math.sin(t * Math.PI * 2) * 0.012 + (st.squash || 0) - m * 0.02;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 8, 190 * (1 - bob / 200), 22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(0, -bob);
  ctx.rotate(st.tilt || 0);
  ctx.scale(1 / Math.sqrt(squash), squash);
  // feet
  ctx.fillStyle = C.dark;
  [-70, 70].forEach((fx, i) => { rr(fx - 46, -22 + (i ? Math.sin(t * 6) * 2 : 0), 92, 36, 18); ctx.fill(); });
  // arms (behind body)
  const arm = (side, ang) => {
    ctx.save(); ctx.translate(side * 128, -130); ctx.rotate(-side * ang);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(side * 34, 60, side * 22, 130);
    ctx.strokeStyle = C.dark; ctx.lineWidth = 36; ctx.stroke(); ctx.strokeStyle = st.bodyC || C.logo; ctx.lineWidth = 20; ctx.stroke();
    ctx.fillStyle = C.cream; ctx.beginPath(); ctx.arc(side * 22, 138, 32, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.dark; ctx.lineWidth = 6; ctx.stroke();
    ctx.restore();
  };
  // body: rounded mountain
  const body = () => {
    ctx.beginPath();
    ctx.moveTo(-200, -8);
    ctx.bezierCurveTo(-190, -60, -120, -250, -40, -360);
    ctx.quadraticCurveTo(0, -410, 40, -360);
    ctx.bezierCurveTo(120, -250, 190, -60, 200, -8);
    ctx.quadraticCurveTo(0, 14, -200, -8);
    ctx.closePath();
  };
  body(); ctx.fillStyle = st.bodyC || C.logo; ctx.fill();
  ctx.save(); body(); ctx.clip();
  // shading side
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.moveTo(40, -420); ctx.lineTo(260, 20); ctx.lineTo(60, 20); ctx.quadraticCurveTo(80, -200, 10, -420); ctx.fill();
  // orange peak cap (snow cap, brand orange), jagged edge
  ctx.fillStyle = C.or; ctx.beginPath(); ctx.moveTo(-200, -440);
  ctx.lineTo(200, -440); ctx.lineTo(200, -268);
  const jag = [[120, -268], [88, -236], [52, -276], [16, -240], [-22, -282], [-58, -244], [-92, -276], [-130, -262]];
  jag.forEach(([a, b]) => ctx.lineTo(a, b + Math.sin(t * 3 + a) * 2));
  ctx.lineTo(-200, -262); ctx.closePath(); ctx.fill();
  ctx.restore();
  body(); ctx.strokeStyle = C.dark; ctx.lineWidth = 9; ctx.stroke();
  arm(-1, st.armL || 0.35); arm(1, st.armR || 0.35);
  // face
  const lx = (st.lookX || 0) * 10, ly = (st.lookY || 0) * 10;
  const bl = blinkAt(t);
  [-52, 52].forEach((ex, i) => {
    const eh = 40 * (st.eye || 1) * (1 - bl * 0.92);
    ctx.fillStyle = C.white; ctx.beginPath(); ctx.ellipse(ex, -170, 32, eh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.dark; ctx.lineWidth = 6; ctx.stroke();
    if (bl < .7) {
      ctx.fillStyle = C.dark; ctx.beginPath(); ctx.ellipse(ex + lx, -164 + ly, 15, 17 * (1 - bl), 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(ex + lx + 5, -171 + ly, 5, 0, Math.PI * 2); ctx.fill();
    }
    // brows
    const brow = st.brow || 0; const bs = i ? 1 : -1;
    const raise = (st.browUp && i === 1) ? -18 : 0;
    ctx.strokeStyle = C.dark; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ex - 24, -222 + raise - m * 6 + bs * brow * 10); ctx.lineTo(ex + 24, -222 + raise - m * 6 - bs * brow * 10); ctx.stroke();
  });
  // cheeks
  ctx.fillStyle = 'rgba(239,118,46,0.35)';
  [-92, 92].forEach(cx => { ctx.beginPath(); ctx.ellipse(cx, -118, 20, 12, 0, 0, Math.PI * 2); ctx.fill(); });
  // mouth
  const smile = st.smile ?? 1;
  const mw = 42 + m * 10, mh = 6 + m * 46;
  ctx.fillStyle = C.dark;
  ctx.beginPath();
  ctx.moveTo(-mw, -112 - smile * 8);
  ctx.quadraticCurveTo(0, -112 + mh * 1.6 + smile * 10, mw, -112 - smile * 8);
  ctx.quadraticCurveTo(0, -112 - smile * 2 + (m > .05 ? -mh * .15 : 6), -mw, -112 - smile * 8);
  ctx.fill();
  if (m > 0.2) { // tongue
    ctx.save(); ctx.clip();
    ctx.fillStyle = '#E0564F'; ctx.beginPath(); ctx.ellipse(0, -112 + mh * 1.1, 22, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ============================================================
   SCENES — each draws a full frame for its local time
   ============================================================ */
const WORDS = () => DATA.words;
const wt = i => V(DATA.words[i].s); // word start in video time
// word indices (see words.json)
// 0 Hey | 1 Du 2 machst 3 die 4 Welt 5 besser | 6 Aber 7 … 8 kommt 9 das 10 auch 11 an?
// 12 Gute 13 Arbeit 14 die 15 keiner 16 sieht | 17 Eine 18 Botschaft 19 die 20 verpufft
// 21 Genau 22 da 23 setzt 24 upHill 25 Value 26 Marketing 27 an 28 – 29 mit 30 drei 31 Hebeln
// 32 Werte 33 Finde 34 die 35 Menschen 36 die 37 so 38 ticken 39 wie 40 Du
// 41 Worte 42 Sag's 43 klar 44 überzeugend 45 und 46 menschlich
// 47 Website 48 Mach 49 Deine 50 Marke 51 sichtbar 52 und 53 erlebbar
// 54 Für 55 Organisationen 56 mit 57 Haltung 58 Mach 59 Deinen 60 Impact 61 deutlich 62 – 63 lass 64 uns 65 kennenlernen

/* --- Scene 1: Intro + "Du machst die Welt besser" --- */
function sceneIntro(t) {
  fillBg(C.dark);
  // radial warm glow
  const g = ctx.createRadialGradient(W / 2, 760, 50, W / 2, 760, 900);
  g.addColorStop(0, 'rgba(239,118,46,0.22)'); g.addColorStop(1, 'rgba(28,28,28,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // intro sting: two brackets slam together then fly apart
  const a = ease(t, 0, .42, E.inOutQ);
  const fly = ease(t, .55, 1.1, E.inC);
  if (fly < 1) {
    withT(W / 2 - 150 * (1 - a) - 600 * fly, 760 + 150 * (1 - a) + 600 * fly, 0, 1 + spring(t, .42, 3, 8) * .2, null, () => bracket(300, 64, C.or));
    withT(W / 2 + 90 + 150 * (1 - a) + 600 * fly, 670 - 150 * (1 - a) - 600 * fly, 0, 1 + spring(t, .42, 3, 8) * .2, null, () => bracket(300, 64, C.or));
  }
  // flash ring on impact
  const r = ease(t, .42, 1.0, E.outQ);
  if (t > .42 && r < 1) { ctx.strokeStyle = `rgba(239,118,46,${1 - r})`; ctx.lineWidth = 40 * (1 - r); ctx.beginPath(); ctx.arc(W / 2, 720, 100 + r * 800, 0, Math.PI * 2); ctx.stroke(); }
  // globe (line art) grows after "Welt"
  const gp = ease(t, wt(4) - .2, wt(4) + .6, E.back);
  if (gp > 0) {
    ctx.save(); ctx.translate(W / 2, 470); ctx.scale(gp, gp);
    ctx.strokeStyle = C.or; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(0, 0, 170, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(239,118,46,0.75)';
    for (let k = 0; k < 5; k++) { const ph = (t * .6 + k / 5) % 1; const rx = Math.cos(ph * Math.PI) * 170; ctx.beginPath(); ctx.ellipse(0, 0, Math.abs(rx), 170, 0, 0, Math.PI * 2); ctx.stroke(); }
    [-.5, 0, .5].forEach(k => { ctx.beginPath(); ctx.ellipse(0, k * 170, 170 * Math.sqrt(1 - k * k), 26 * Math.sqrt(1 - k * k), 0, 0, Math.PI * 2); ctx.stroke(); });
    // orbiting sparkles
    for (let k = 0; k < 6; k++) { const an = t * 1.4 + k * 1.05; ctx.fillStyle = C.cream; ctx.beginPath(); ctx.arc(Math.cos(an) * 250, Math.sin(an) * 70 - 20, 7 + 3 * Math.sin(t * 5 + k), 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  // "Hey!" burst
  const hp = ease(t, wt(0) - .05, wt(0) + .35, E.back), ho = ease(t, wt(1) - .2, wt(1) + .1, E.inC);
  if (hp > 0 && ho < 1) withT(W / 2, 700, -0.08, hp * (1 - ho), null, () => { font(230, 'PF', 700, true); ctx.fillStyle = C.or; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Hey!', 0, 0); });
  kinetic([
    [{ s: 'Du', t: wt(1) }, { s: 'machst', t: wt(2) }],
    [{ s: 'die', t: wt(3) }, { s: 'Welt', t: wt(4), c: C.or, it: true, w: 500 }],
    [{ s: 'besser.', t: wt(5), u: 1 }],
  ], W / 2, 810, t, { size: 128, c: C.cream, out: 3.0 });
}

/* --- Scene 2: "Aber … kommt das auch an?" --- */
function sceneQuestion(t) {
  fillBg(C.dark);
  // signal arcs that break up
  for (let k = 0; k < 5; k++) {
    const ph = ((t - 2.6) * .9 + k * .2) % 1; if (t < 2.6) continue;
    const r = 80 + ph * 520; const glitch = rand(Math.floor(t * 12) + k) > .55;
    ctx.strokeStyle = `rgba(239,118,46,${(1 - ph) * (glitch ? .15 : .7)})`; ctx.lineWidth = 12;
    ctx.setLineDash(glitch ? [18, 34] : []);
    ctx.beginPath(); ctx.arc(W / 2, 1320, r, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  ctx.setLineDash([]);
  // giant question mark
  const qp = ease(t, wt(11) - .1, wt(11) + .5, E.back);
  if (qp > 0) {
    const wob = spring(t, wt(11) + .3, 1.8, 3) * .25;
    withT(W - 160, 330, wob + .12, qp, null, () => { font(420, 'PF', 700, true); ctx.fillStyle = C.or; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.globalAlpha = .95; ctx.fillText('?', 0, 0); });
  }
  const shake = t > wt(11) ? spring(t, wt(11) + .05, 9, 9) * 18 : 0;
  ctx.save(); ctx.translate(shake, 0);
  kinetic([
    [{ s: 'Aber…', t: wt(6), size: 90, c: C.logo, w: 500, it: true }],
    [{ s: 'kommt', t: wt(8) }, { s: 'das', t: wt(9) }],
    [{ s: 'auch', t: wt(10) }, { s: 'an?', t: wt(11), c: C.or }],
  ], W / 2 - 40, 560, t, { size: 150, c: C.cream, lh: 1.05 });
  ctx.restore();
}

/* --- Scene 3: pain points that nobody sees, then "verpufft" --- */
const PAINS = ['Botschaft geht verloren', 'Team spricht anders', 'Zielgruppe unklar', 'Themen zu komplex', 'Wenig Wirkung', 'Vertrauen fehlt'];
function scenePain(t) {
  fillBg('#262524');
  // faint grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  kinetic([
    [{ s: 'Gute', t: wt(12) }, { s: 'Arbeit,', t: wt(13) }],
    [{ s: 'die', t: wt(14), c: C.logo }, { s: 'keiner', t: wt(15), c: C.logo }, { s: 'sieht.', t: wt(16), c: C.logo }],
  ], W / 2, 250, t, { size: 110, c: C.cream, out: wt(17) - .5 });
  kinetic([
    [{ s: 'Eine', t: wt(17) }, { s: 'Botschaft,', t: wt(18) }],
    [{ s: 'die', t: wt(19), c: C.logo }, { s: 'verpufft.', t: wt(20), c: C.or, it: true, w: 500 }],
  ], W / 2, 250, t, { size: 110, c: C.cream });
  const poofT = wt(20) + .15;
  PAINS.forEach((p, i) => {
    const t0 = wt(12) + i * .32;
    const pin = ease(t, t0, t0 + .5, E.back);
    if (pin <= 0) return;
    const col = i % 2, row = Math.floor(i / 2);
    const x = 290 + col * 500, y = 560 + row * 175;
    const rot = (rand(i + 4) - .5) * .12;
    const fade = t > wt(14) ? .35 + .65 * (1 - ease(t, wt(14), wt(16) + .3)) : 1; // "die keiner sieht" -> cards fade to invisible
    if (t < poofT) {
      withT(x, y - (1 - pin) * 200, rot * pin + (1 - pin) * .4, lerp(.6, 1, pin), null, () => {
        ctx.globalAlpha = fade;
        rr(-230, -62, 460, 124, 26); ctx.fillStyle = '#3A3937'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = C.or; ctx.beginPath(); ctx.arc(-172, 0, 24, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = C.dark; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-182, -10); ctx.lineTo(-162, 10); ctx.moveTo(-162, -10); ctx.lineTo(-182, 10); ctx.stroke();
        label(p, -132, 2, 36, C.cream, 'left', 500);
        ctx.globalAlpha = 1;
      });
    } else {
      // disintegrate into particles drifting up-right
      const k = t - poofT;
      for (let j = 0; j < 46; j++) {
        const px = x + (rand(i * 97 + j) - .5) * 460, py = y + (rand(i * 31 + j * 7) - .5) * 124;
        const d = clamp(k * 1.4 - rand(j * 3 + i) * .4);
        if (d >= 1) continue;
        const dx = (rand(j + i * 5) - .2) * 420 * E.outC(d), dy = -(rand(j * 9 + i) * 380 + 80) * E.outC(d);
        ctx.fillStyle = j % 3 ? `rgba(240,237,233,${(1 - d) * .8})` : `rgba(239,118,46,${1 - d})`;
        const s = (1 - d) * (6 + rand(j * 13 + i) * 10);
        ctx.fillRect(px + dx, py + dy, s, s);
      }
    }
  });
}

/* --- Scene 4: brand reveal + "drei Hebel" --- */
function sceneBrand(t) {
  fillBg(C.or);
  // rising stair brackets pattern (uphill motif)
  for (let i = 0; i < 9; i++) {
    const tt = (t * .5 + i / 9) % 1;
    const x = -100 + tt * 1300, y = 1900 - tt * 1300 - (i % 3) * 180;
    withT(x, y, 0, .6 + (i % 3) * .2, null, () => bracket(180, 38, 'rgba(255,255,255,0.13)'));
  }
  // logo card
  const lp = ease(t, wt(24) - .15, wt(24) + .45, E.back);
  const lOut = ease(t, wt(29) - .1, wt(29) + .35, E.inOutQ);
  if (lp > 0) {
    const s = lp * (1 + spring(t, wt(24) + .1, 2.5, 6) * .05);
    const y = lerp(560, 330, lOut);
    withT(W / 2, y, (1 - lp) * -.2, s * lerp(1, .62, lOut), null, () => {
      rr(-400, -250, 800, 500, 48); ctx.fillStyle = C.white; ctx.fill();
      ctx.shadowColor = 'transparent';

  else if (type === 'wipeUp') { const y = H - E.inOutQ(p) * (H + 300); ctx.moveTo(0, y + 300); ctx.quadraticCurveTo(W / 2, y - 150, W, y + 300); ctx.lineTo(W, H); ctx.lineTo(0, H); }

  else if (type === 'slide') { const x = W - E.inOutQ(p) * W; ctx.rect(x, 0, W, H); }

}
// global camera punches (in on hits)
const HITS = () => [.42, wt(11), wt(20) + .15, wt(24), wt(30), wt(60), wt(63)];

function drawFrame(t) {
  ctx.save();
  // camera
  let z = 1, sx = 0, sy = 0;
  HITS().forEach(h => { z += Math.max(0, spring(t, h, 1.2, 7)) * .035; const k = spring(t, h, 13, 12) * 10; sx += k; sy += k * .6; });
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  // scenes with transitions
  let cur = SC.findIndex(s => t >= s.a && t < s.b); if (cur < 0) cur = SC.length - 1;
  const S = SC[cur];
  const inTr = S.tr && t < S.a + TR && cur > 0;
  if (inTr) {
    SC[cur - 1].fn(t);
    ctx.save(); clipFor(S.tr, (t - S.a) / TR); ctx.clip();
    S.fn(t);
    ctx.restore();
    // glitch transition extra: RGB slices
    if (S.tr === 'glitch') {
      const p = (t - S.a) / TR;
      for (let i = 0; i < 8; i++) { const y = rand(i + Math.floor(t * 30)) * H; ctx.drawImage(buf, 0, y, W, 60, (rand(i * 3 + Math.floor(t * 30)) - .5) * 160 * (1 - p), y, W, 60); }
    }
    // accent bar following the transition edge
    if (S.tr === 'slash' || S.tr === 'wipeUp') {
      ctx.save(); clipFor(S.tr, Math.min(1, (t - S.a) / TR + .06)); ctx.fillStyle = C.or; ctx.globalAlpha = 1; ctx.fill(); ctx.restore();
      ctx.save(); clipFor(S.tr, (t - S.a) / TR); ctx.clip(); S.fn(t); ctx.restore();
    }
  } else S.fn(t);
  // character on top
  const h = hilliState(t);
  if (t > .5) hilli(h.x, h.y, h.s, t, h.st);
  ctx.restore();
  // film finish: vignette + grain
  const v = ctx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grains[Math.floor(t * FPS) % grains.length], 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  // final fade out
  const fo = ease(t, DUR - .5, DUR, E.inOut);
  if (fo > 0) { ctx.fillStyle = `rgba(28,28,28,${fo})`; ctx.fillRect(0, 0, W, H); }
}

// motion blur: average N sub-frames across a 180° shutter
function render(t, samples = 4) {
  out.globalAlpha = 1; out.clearRect(0, 0, W, H);
  for (let i = 0; i < samples; i++) {
    const st = t + (i / samples) * (0.5 / FPS);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    drawFrame(st);
    out.globalAlpha = 1 / (i + 1);
    out.drawImage(buf, 0, 0);
  }
  out.globalAlpha = 1;
}

async function init() {
  DATA = await (await fetch('assets/data.json')).json();
  LOGO = new Image(); LOGO.src = 'assets/logo.svg'; await LOGO.decode();
  await Promise.all([
    document.fonts.load('700 100px PF'), document.fonts.load('500 100px PF'), document.fonts.load('italic 500 100px PF'),
    document.fonts.load('400 40px IN'), document.fonts.load('500 40px IN'),
  ]);
  buildTimeline();
  window.READY = true;
  if (!location.search.includes('render')) { // live preview
    const t0 = performance.now();
    const loop = () => { const t = ((performance.now() - t0) / 1000) % DUR; render(t, 1); requestAnimationFrame(loop); };
    loop();
  }
}
window.render = render; window.DUR = DUR; window.FPS = FPS;
init();
</script>
